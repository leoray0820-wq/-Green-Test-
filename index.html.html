<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lineage RPG Ultimate Edition</title>
  <style>
    :root {
      --bg-color: #0b0c10;
      --panel-bg: rgba(20, 24, 33, 0.95);
      --border-color: #45a29e;
      --text-main: #c5c6c7;
      --gold-color: #f39c12;
      --hp-color: #e74c3c;
      --mp-color: #3498db;
      --exp-color: #2ecc71;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Consolas', 'Microsoft JhengHei', monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      width: 1000px;
      height: 700px;
      background: #000;
      border: 3px solid #333;
      box-shadow: 0 0 20px rgba(0,255,200,0.2);
      display: flex;
      flex-direction: column;
      position: relative;
    }
    /* 頂部狀態列 */
    #top-bar {
      height: 60px;
      background: #111;
      border-bottom: 2px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 15px;
    }
    .char-info { display: flex; gap: 15px; align-items: center; }
    .status-bars { width: 220px; display: flex; flex-direction: column; gap: 4px; }
    .bar-wrap { height: 12px; background: #222; border: 1px solid #444; position: relative; border-radius: 2px; }
    .bar-fill { height: 100%; transition: width 0.1s; }
    .bar-text { position: absolute; top: -2px; left: 0; width: 100%; text-align: center; font-size: 10px; color: #fff; text-shadow: 1px 1px 1px #000; }
    
    /* 戰鬥畫布 */
    #canvas-container { flex: 1; position: relative; background: #050505; }
    canvas { width: 100%; height: 100%; display: block; }
    
    /* 底部控制介面 */
    #bottom-bar {
      height: 220px;
      background: var(--panel-bg);
      border-top: 2px solid var(--border-color);
      display: flex;
    }
    .panel-tab { flex: 1; border-right: 1px solid #333; padding: 10px; display: flex; flex-direction: column; }
    .tab-title { font-size: 14px; color: var(--gold-color); font-weight: bold; margin-bottom: 8px; border-bottom: 1px solid #444; padding-bottom: 4px; display: flex; justify-content: space-between; }
    
    /* 背包格 */
    .inventory-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; overflow-y: auto; max-height: 160px; }
    .item-slot {
      width: 42px; height: 42px; background: #1a1a24; border: 1px solid #333; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; position: relative; font-size: 11px;
    }
    .item-slot:hover { border-color: var(--border-color); background: #252535; }
    .item-slot .count { position: absolute; bottom: 1px; right: 2px; font-size: 9px; color: #fff; }
    .item-tier-gold { border-color: #f1c40f !important; box-shadow: 0 0 5px rgba(241, 196, 15, 0.5); }
    .item-tier-red { border-color: #e74c3c !important; }
    .item-tier-purple { border-color: #9b59b6 !important; }
    .item-tier-blue { border-color: #3498db !important; }

    /* 按鈕樣式 */
    .btn { background: #2c3e50; color: #fff; border: 1px solid #34495e; padding: 4px 8px; font-size: 11px; cursor: pointer; border-radius: 3px; }
    .btn:hover { background: #34495e; border-color: var(--border-color); }
    .btn-gold { background: #b7950b; border-color: #f1c40f; }

    /* 全螢幕創角彈窗 */
    #modal-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; z-index: 99;
    }
    .modal-box { background: #151922; border: 2px solid var(--gold-color); padding: 25px; border-radius: 8px; width: 450px; text-align: center; }
    .class-select { display: flex; justify-content: space-around; margin: 20px 0; }
    .class-card { border: 1px solid #444; padding: 10px; cursor: pointer; width: 30%; border-radius: 5px; }
    .class-card.selected { border-color: var(--gold-color); background: rgba(241, 196, 15, 0.1); }

    /* Floating log */
    #game-log { position: absolute; top: 70px; right: 10px; width: 260px; height: 150px; background: rgba(0,0,0,0.6); border: 1px solid #333; pointer-events: none; padding: 5px; font-size: 11px; overflow: hidden; display: flex; flex-direction: column-reverse; }
    .log-line { margin: 2px 0; }
  </style>
</head>
<body>

<div id="game-container">
  <!-- 創角視窗 -->
  <div id="modal-overlay">
    <div class="modal-box">
      <h2 style="color:var(--gold-color)">選擇職業進入《天堂 Lineage》</h2>
      <div class="class-select">
        <div class="class-card selected" onclick="selectClass('royal')">
          <h3>王族</h3>
          <p style="font-size:10px; color:#aaa; margin-top:5px;">全隊領袖<br>高防禦與經驗加成</p>
        </div>
        <div class="class-card" onclick="selectClass('knight')">
          <h3>騎士</h3>
          <p style="font-size:10px; color:#aaa; margin-top:5px;">近戰王者<br>極高血量與爆擊</p>
        </div>
        <div class="class-card" onclick="selectClass('elf')">
          <h3>妖精</h3>
          <p style="font-size:10px; color:#aaa; margin-top:5px;">遠程霸主<br>高攻速與魔力恢復</p>
        </div>
      </div>
      <button class="btn btn-gold" style="padding:8px 20px; font-size:14px;" onclick="startGame()">踏入戰場</button>
    </div>
  </div>

  <!-- 頂部欄 -->
  <div id="top-bar">
    <div class="char-info">
      <div>
        <span id="char-name" style="color:var(--gold-color); font-weight:bold;">角色名稱</span>
        <span id="char-class" style="font-size:11px; color:#888;">[職業]</span>
        <span id="char-rebirth" style="color:#e74c3c; font-weight:bold;"></span>
      </div>
      <div style="font-size:12px;">Lv.<span id="char-lv">1</span></div>
    </div>
    <div class="status-bars">
      <div class="bar-wrap">
        <div id="hp-bar" class="bar-fill" style="background:var(--hp-color); width:100%;"></div>
        <div id="hp-text" class="bar-text">HP: 100/100</div>
      </div>
      <div class="bar-wrap">
        <div id="mp-bar" class="bar-fill" style="background:var(--mp-color); width:100%;"></div>
        <div id="mp-text" class="bar-text">MP: 50/50</div>
      </div>
      <div class="bar-wrap">
        <div id="exp-bar" class="bar-fill" style="background:var(--exp-color); width:0%;"></div>
        <div id="exp-text" class="bar-text">EXP: 0%</div>
      </div>
    </div>
    <div style="font-size:12px;">
      Adena: <span id="char-gold" style="color:var(--gold-color);">0</span> G
    </div>
  </div>

  <!-- 遊戲畫布與 Log -->
  <div id="canvas-container">
    <canvas id="gameCanvas"></canvas>
    <div id="game-log"></div>
  </div>

  <!-- 底部控制面版 -->
  <div id="bottom-bar">
    <!-- 地圖與自動戰鬥面板 -->
    <div class="panel-tab" style="max-width:220px;">
      <div class="tab-title">狩獵場與掛機 AI</div>
      <select id="map-select" style="background:#111; color:#fff; border:1px solid #444; padding:3px; font-size:11px;" onchange="changeMap()">
        <option value="1">1. 歌唱之島 (Lv.1-15)</option>
        <option value="2">2. 地底洞窟 (Lv.16-35)</option>
        <option value="3">3. 龍之谷 (Lv.36-60)</option>
        <option value="4">4. 火龍窟 (Lv.61-85)</option>
        <option value="5">5. 神龍之谷 (Lv.86-100)</option>
        <option value="boss">★ BOSS 狂暴獵場</option>
        <option value="tower">🏰 試煉之塔 (1-100層)</option>
      </select>
      <div style="margin-top:10px; display:flex; flex-direction:column; gap:4px; font-size:11px;">
        <label><input type="checkbox" id="auto-hp" checked> 自動吃大紅 (HP < 50%)</label>
        <label><input type="checkbox" id="auto-mp" checked> 自動吃大藍 (MP < 30%)</label>
        <label><input type="checkbox" id="auto-skill" checked> 自動釋放全屏/範圍技能</label>
      </div>
      <button class="btn btn-gold" style="margin-top:auto;" onclick="rebirthPlayer()">Lv.100 轉生/輪迴</button>
    </div>

    <!-- 技能區 -->
    <div class="panel-tab" style="max-width:260px;">
      <div class="tab-title">
        <span>技能天賦 (SP: <span id="sp-points">0</span>)</span>
      </div>
      <div style="display:flex; flex-direction:column; gap:3px; overflow-y:auto; font-size:11px;">
        <div style="display:flex; justify-between; align-items:center;">
          <span>強攻(被動) Lv.<span id="sk-atk-lv">0</span></span>
          <button class="btn" onclick="upgradeSkill('atk')">+1</button>
        </div>
        <div style="display:flex; justify-between; align-items:center;">
          <span>狂暴覺醒(100%暴擊)</span>
          <button class="btn" onclick="castBuff()">發動</button>
        </div>
        <div style="display:flex; justify-between; align-items:center;">
          <span>範圍打擊(AOE)</span>
          <button class="btn" onclick="castAOE()">發動</button>
        </div>
        <div style="display:flex; justify-between; align-items:center;">
          <span style="color:#f1c40f;">末日審判(全屏)</span>
          <button class="btn btn-gold" onclick="castScreenNuke()">發動</button>
        </div>
      </div>
    </div>

    <!-- 背包與裝備 -->
    <div class="panel-tab">
      <div class="tab-title">背包與裝備管理</div>
      <div class="inventory-grid" id="inventory"></div>
    </div>
  </div>
</div>

<script>
  // JS 核心遊戲引擎邏輯
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  
  let selectedClass = 'royal';
  let player = {
    name: '冒險者',
    class: 'royal',
    lv: 1,
    hp: 100, maxHp: 100,
    mp: 50, maxMp: 50,
    exp: 0, maxExp: 100,
    gold: 1000,
    sp: 0,
    rebirthCount: 0,
    baseAtk: 15,
    equippedWeapon: null,
    equippedArmor: null,
    skills: { atk: 0, def: 0, hp: 0, mp: 0 }
  };

  let monsters = [];
  let pets = [];
  let drops = [];

  function selectClass(cls) {
    selectedClass = cls;
    document.querySelectorAll('.class-card').forEach(c => c.classList.remove('selected'));
    event.currentTarget.classList.add('selected');
  }

  function startGame() {
    player.class = selectedClass;
    document.getElementById('modal-overlay').style.display = 'none';
    initCanvas();
    spawnMonsters();
    gameLoop();
    log("歡迎來到《天堂 Lineage》隨機寶物世界！");
  }

  function initCanvas() {
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
  }

  function spawnMonsters() {
    monsters = [];
    for(let i=0; i<10; i++) {
      monsters.push({
        x: Math.random() * (canvas.width - 50) + 25,
        y: Math.random() * (canvas.height - 50) + 25,
        hp: 50 * player.lv,
        maxHp: 50 * player.lv,
        name: `地下骷髏 Lv.${player.lv}`
      });
    }
  }

  function gameLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // 繪製背景與怪物
    monsters.forEach(m => {
      ctx.fillStyle = '#e74c3c';
      ctx.beginPath();
      ctx.arc(m.x, m.y, 15, 0, Math.PI * 2);
      ctx.fill();
      
      // HP條
      ctx.fillStyle = '#000';
      ctx.fillRect(m.x - 15, m.y - 25, 30, 4);
      ctx.fillStyle = '#2ecc71';
      ctx.fillRect(m.x - 15, m.y - 25, (m.hp / m.maxHp) * 30, 4);
    });

    requestAnimationFrame(gameLoop);
  }

  function log(msg) {
    const l = document.getElementById('game-log');
    const div = document.createElement('div');
    div.className = 'log-line';
    div.innerText = msg;
    l.insertBefore(div, l.firstChild);
  }

  function castScreenNuke() {
    monsters.forEach(m => {
      m.hp -= 999;
      log(`末日審判對 ${m.name} 造成 999 點全屏毀滅傷害！`);
    });
    monsters = monsters.filter(m => m.hp > 0);
    if(monsters.length === 0) setTimeout(spawnMonsters, 1000);
  }

  function rebirthPlayer() {
    if(player.lv >= 100) {
      player.lv = 1;
      player.rebirthCount++;
      document.getElementById('char-rebirth').innerText = `[${player.rebirthCount} 轉]`;
      log("恭喜突破極限！達成轉生！");
    } else {
      log("等級未滿 Lv.100 無法轉生！");
    }
  }
</script>
</body>
</html>
