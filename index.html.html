<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>市集銷售實時紀錄系統 Market Sales Tracker</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts Inter & Noto Sans TC -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
              800: '#166534',
            },
            earth: {
              50: '#fffbeb',
              100: '#fef3c7',
              500: '#f59e0b',
              700: '#b45309',
              800: '#78350f',
            }
          },
          fontFamily: {
            sans: ['Noto Sans TC', 'Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    /* Custom scrollbar for transaction history */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f1f1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body class="bg-stone-50 text-stone-800 font-sans min-h-screen flex flex-col justify-between selection:bg-emerald-100 selection:text-emerald-800">

  <!-- Main Navigation & Header -->
  <header class="bg-emerald-800 text-white shadow-md sticky top-0 z-40">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="bg-amber-500 text-stone-900 w-10 h-10 rounded-xl flex items-center justify-center font-bold text-xl shadow-inner">
          <i class="fa-solid font-bold fa-store"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight">市集銷售隨手記</h1>
          <p class="text-xs text-emerald-200 flex items-center gap-1">
            <span id="sync-status-indicator" class="w-2 h-2 rounded-full bg-emerald-400 inline-block animate-pulse"></span>
            <span id="sync-status-text">雲端同步中</span>
          </p>
        </div>
      </div>

      <!-- Navigation Tabs -->
      <nav class="flex bg-emerald-900/60 p-1 rounded-xl text-sm font-medium">
        <button id="tab-btn-sales" onclick="switchTab('sales')" class="px-3 py-1.5 rounded-lg transition-all duration-200 bg-white text-emerald-900 shadow">
          <i class="fa-solid fa-calculator mr-1"></i>銷售主頁
        </button>
        <button id="tab-btn-history" onclick="switchTab('history')" class="px-3 py-1.5 rounded-lg transition-all duration-200 text-emerald-100 hover:text-white">
          <i class="fa-solid fa-chart-line mr-1"></i>歷史與統計
        </button>
      </nav>
    </div>
  </header>

  <!-- Dynamic Summary Header Banner (Sticky Below Nav) -->
  <div class="bg-amber-50 border-b border-amber-200/80 px-4 py-3 shadow-sm">
    <div class="max-w-4xl mx-auto flex flex-wrap items-center justify-between gap-2">
      <div class="flex items-baseline space-x-2">
        <span class="text-sm font-medium text-stone-600">本日累積銷售總額:</span>
        <span id="grand-total" class="text-3xl font-extrabold text-emerald-700">NT$ 0</span>
      </div>
      <div class="flex items-center space-x-4 text-sm text-stone-600">
        <div>總售出件數: <span id="grand-count" class="font-bold text-stone-800">0</span> 包/件</div>
        <button onclick="openAddModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-3 py-1.5 rounded-lg text-sm shadow transition flex items-center gap-1">
          <i class="fa-solid fa-plus"></i> 新增品項
        </button>
      </div>
    </div>
  </div>

  <!-- Main Content Container -->
  <main class="max-w-4xl mx-auto px-4 py-6 flex-grow w-full">

    <!-- TAB 1: SALES MAIN PAGE -->
    <section id="tab-sales" class="space-y-6">

      <!-- Quick Add New Product Bar -->
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-stone-200">
        <h2 class="text-sm font-semibold text-stone-700 mb-3 flex items-center gap-2">
          <i class="fa-solid fa-cart-plus text-emerald-600"></i> 快速新增銷售商品
        </h2>
        <form id="add-product-form" onsubmit="handleCreateProduct(event)" class="grid grid-cols-1 sm:grid-cols-12 gap-3">
          <div class="sm:col-span-6">
            <input type="text" id="new-product-name" placeholder="商品名稱 (例: 芭蕉乾, 有機草莓)" required
              class="w-full px-3.5 py-2.5 rounded-xl border border-stone-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent text-sm">
          </div>
          <div class="sm:col-span-4">
            <div class="relative">
              <span class="absolute left-3 top-2.5 text-stone-400 text-sm">NT$</span>
              <input type="number" id="new-product-price" min="0" step="1" placeholder="單價" required
                class="w-full pl-11 pr-3 py-2.5 rounded-xl border border-stone-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent text-sm">
            </div>
          </div>
          <div class="sm:col-span-2">
            <button type="submit" class="w-full h-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 px-4 rounded-xl shadow transition text-sm flex items-center justify-center gap-1">
              <i class="fa-solid fa-plus"></i> 新增
            </button>
          </div>
        </form>
      </div>

      <!-- Products Grid -->
      <div>
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-base font-bold text-stone-800 flex items-center gap-2">
            <i class="fa-solid fa-boxes-stacked text-amber-600"></i> 目前展售商品列表
          </h2>
          <span class="text-xs text-stone-500">點擊 ＋ / － 按鈕即可直接即時紀錄並同步雲端</span>
        </div>

        <div id="product-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <!-- Dynamic product cards will be rendered here -->
          <div class="col-span-full py-12 text-center text-stone-400 bg-white rounded-2xl border border-dashed border-stone-300">
            <i class="fa-solid fa-spinner fa-spin text-2xl text-emerald-600 mb-2"></i>
            <p>載入商品資料中...</p>
          </div>
        </div>
      </div>
    </section>

    <!-- TAB 2: HISTORY & ANALYTICS -->
    <section id="tab-history" class="space-y-6 hidden">
      
      <!-- Action Toolbar -->
      <div class="flex flex-wrap items-center justify-between gap-3 bg-white p-4 rounded-2xl shadow-sm border border-stone-200">
        <div>
          <h2 class="text-base font-bold text-stone-800">銷售紀錄統計與備份</h2>
          <p class="text-xs text-stone-500">檢視所有銷售數據、匯出報表或開立新市集 Session</p>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="exportCSV()" class="bg-stone-700 hover:bg-stone-800 text-white text-xs font-medium px-3.5 py-2.5 rounded-xl shadow transition flex items-center gap-1.5">
            <i class="fa-solid fa-file-csv text-emerald-400"></i> 匯出 CSV 報表
          </button>
          <button onclick="confirmResetSession()" class="bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 text-xs font-medium px-3.5 py-2.5 rounded-xl transition flex items-center gap-1.5">
            <i class="fa-solid fa-rotate-right"></i> 清空重置當前數據
          </button>
        </div>
      </div>

      <!-- Item Sales Summary Table -->
      <div class="bg-white rounded-2xl shadow-sm border border-stone-200 overflow-hidden">
        <div class="px-5 py-4 border-b border-stone-100 flex items-center justify-between">
          <h3 class="font-bold text-stone-800 text-sm flex items-center gap-2">
            <i class="fa-solid fa-list-check text-emerald-600"></i> 各商品銷售總計
          </h3>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-sm">
            <thead class="bg-stone-50 text-stone-500 border-b border-stone-100">
              <tr>
                <th class="px-5 py-3 font-medium">商品名稱</th>
                <th class="px-5 py-3 font-medium">單價</th>
                <th class="px-5 py-3 font-medium">已售出數量</th>
                <th class="px-5 py-3 font-medium text-right">銷售小計</th>
              </tr>
            </thead>
            <tbody id="summary-table-body" class="divide-y divide-stone-100 text-stone-700">
              <!-- Summary rows inserted dynamically -->
            </tbody>
          </table>
        </div>
      </div>

      <!-- Transaction Log -->
      <div class="bg-white rounded-2xl shadow-sm border border-stone-200 overflow-hidden">
        <div class="px-5 py-4 border-b border-stone-100 flex items-center justify-between">
          <h3 class="font-bold text-stone-800 text-sm flex items-center gap-2">
            <i class="fa-solid fa-clock-rotate-left text-amber-600"></i> 實時點數異動日誌 (Recent Transactions)
          </h3>
          <span class="text-xs text-stone-400">最近 50 筆異動</span>
        </div>
        <div class="max-h-80 overflow-y-auto divide-y divide-stone-100" id="transaction-log-list">
          <!-- Logs will be populated dynamically -->
          <div class="p-6 text-center text-stone-400 text-xs">暫無紀錄</div>
        </div>
      </div>

    </section>

  </main>

  <!-- Footer -->
  <footer class="bg-white border-t border-stone-200 py-4 text-center text-xs text-stone-400">
    <div class="max-w-4xl mx-auto px-4 flex flex-col sm:flex-row justify-between items-center gap-2">
      <p>市集銷售紀錄系統 &copy; 2026 - 支援 GitHub Pages 雲端即時備份</p>
      <p class="flex items-center gap-1 text-stone-500">
        <i class="fa-solid fa-cloud text-emerald-600"></i> 狀態: <span id="firebase-status">雲端同步模式</span>
      </p>
    </div>
  </footer>

  <!-- Modal for Editing Product -->
  <div id="edit-modal" class="fixed inset-0 bg-stone-900/40 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-stone-100 space-y-4">
      <div class="flex justify-between items-center border-b border-stone-100 pb-3">
        <h3 class="font-bold text-stone-800">修改商品資訊</h3>
        <button onclick="closeEditModal()" class="text-stone-400 hover:text-stone-600">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>
      <form id="edit-product-form" onsubmit="handleSaveEdit(event)" class="space-y-4">
        <input type="hidden" id="edit-product-id">
        <div>
          <label class="block text-xs font-semibold text-stone-600 mb-1">商品名稱</label>
          <input type="text" id="edit-product-name" required class="w-full px-3 py-2 border border-stone-300 rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-stone-600 mb-1">單價 (NT$)</label>
          <input type="number" id="edit-product-price" min="0" step="1" required class="w-full px-3 py-2 border border-stone-300 rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-stone-600 mb-1">當前銷售數量</label>
          <input type="number" id="edit-product-count" min="0" step="1" required class="w-full px-3 py-2 border border-stone-300 rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeEditModal()" class="px-4 py-2 bg-stone-100 text-stone-600 text-xs font-medium rounded-xl hover:bg-stone-200">取消</button>
          <button type="submit" class="px-4 py-2 bg-emerald-600 text-white text-xs font-semibold rounded-xl hover:bg-emerald-700 shadow">儲存更新</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Custom Alert/Confirm Toast Notification Container -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-sm"></div>

  <!-- Firebase Integration Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, deleteDoc, onSnapshot, collection, query, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // Application state
    let products = [];
    let transactions = [];
    let db = null;
    let auth = null;
    let currentUser = null;
    let isCloudSyncAvailable = false;

    // Config setup
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'market-sales-tracker-app';
    const firebaseConfig = typeof __firebase_config !== 'undefined' 
      ? JSON.parse(__firebase_config) 
      : {
          apiKey: "demo-key",
          authDomain: "demo.firebaseapp.com",
          projectId: "demo-project",
          storageBucket: "demo.appspot.com",
          messagingSenderId: "123456789",
          appId: "1:123456789:web:abcdef"
        };

    // Initialize Firebase
    try {
      const app = initializeApp(firebaseConfig);
      db = getFirestore(app);
      auth = getAuth(app);

      // Auth initialization
      const initAuth = async () => {
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }
      };

      initAuth().catch(err => {
        console.warn("Firebase Auth fallback to local mode:", err);
        showToast("進入離線/預設模式", "info");
      });

      onAuthStateChanged(auth, (user) => {
        if (user) {
          currentUser = user;
          isCloudSyncAvailable = true;
          updateSyncStatus(true, "雲端自動連線中");
          setupRealtimeListeners();
        } else {
          isCloudSyncAvailable = false;
          updateSyncStatus(false, "單機模式");
          loadDefaultSampleData();
        }
      });
    } catch (e) {
      console.warn("Firebase Initialization error, falling back to local memory:", e);
      updateSyncStatus(false, "離線預設模式");
      loadDefaultSampleData();
    }

    // Set up Firestore collection realtime listener
    function setupRealtimeListeners() {
      if (!db || !currentUser) return;

      const productsColRef = collection(db, 'artifacts', appId, 'public', 'data', 'products');
      const transactionsColRef = collection(db, 'artifacts', appId, 'public', 'data', 'transactions');

      // Listen to products
      onSnapshot(productsColRef, (snapshot) => {
        const loadedProducts = [];
        snapshot.forEach((doc) => {
          loadedProducts.push({ id: doc.id, ...doc.data() });
        });
        
        // If first load and empty, populate defaults
        if (loadedProducts.length === 0 && products.length === 0) {
          seedInitialProducts();
        } else {
          products = loadedProducts;
          renderUI();
        }
      }, (error) => {
        console.error("Products subscription error:", error);
        updateSyncStatus(false, "連線有限");
      });

      // Listen to logs/transactions
      onSnapshot(transactionsColRef, (snapshot) => {
        const loadedTx = [];
        snapshot.forEach((doc) => {
          loadedTx.push({ id: doc.id, ...doc.data() });
        });
        // Sort transactions by time descending
        transactions = loadedTx.sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));
        renderTransactions();
      }, (error) => {
        console.error("Transactions subscription error:", error);
      });
    }

    // Seed default items if empty
    async function seedInitialProducts() {
      const defaults = [
        { name: '芭蕉乾', price: 100, count: 0 },
        { name: '有機椴木香菇', price: 250, count: 0 },
        { name: '手作洛神花醬', price: 150, count: 0 }
      ];
      for (const item of defaults) {
        await createProductInDb(item.name, item.price, item.count);
      }
    }

    function loadDefaultSampleData() {
      if (products.length === 0) {
        products = [
          { id: '1', name: '芭蕉乾', price: 100, count: 0 },
          { id: '2', name: '有機椴木香菇', price: 250, count: 0 },
          { id: '3', name: '手作洛神花醬', price: 150, count: 0 }
        ];
      }
      renderUI();
    }

    // Database CRUD wrappers
    async function createProductInDb(name, price, count = 0) {
      if (isCloudSyncAvailable && db) {
        try {
          const productsColRef = collection(db, 'artifacts', appId, 'public', 'data', 'products');
          await addDoc(productsColRef, {
            name,
            price: Number(price),
            count: Number(count),
            updatedAt: serverTimestamp()
          });
          showToast(`已成功新增品項: ${name}`, "success");
        } catch (err) {
          console.error("Failed to add product to Firestore:", err);
        }
      } else {
        // Fallback local memory
        const newProduct = { id: Date.now().toString(), name, price: Number(price), count: Number(count) };
        products.push(newProduct);
        renderUI();
        showToast(`已新增品項: ${name}`, "success");
      }
    }

    async function updateProductQuantityInDb(productId, delta) {
      const prod = products.find(p => p.id === productId);
      if (!prod) return;

      const newCount = Math.max(0, (prod.count || 0) + delta);
      const actualDelta = newCount - (prod.count || 0);
      if (actualDelta === 0 && delta < 0) return; // cannot go below 0

      if (isCloudSyncAvailable && db) {
        try {
          const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'products', productId);
          await setDoc(docRef, { count: newCount }, { merge: true });

          // Log transaction
          const txColRef = collection(db, 'artifacts', appId, 'public', 'data', 'transactions');
          await addDoc(txColRef, {
            productName: prod.name,
            delta: actualDelta,
            unitPrice: prod.price,
            totalChange: actualDelta * prod.price,
            timestamp: serverTimestamp()
          });
        } catch (err) {
          console.error("Error updating quantity:", err);
        }
      } else {
        prod.count = newCount;
        transactions.unshift({
          id: Date.now().toString(),
          productName: prod.name,
          delta: actualDelta,
          unitPrice: prod.price,
          totalChange: actualDelta * prod.price,
          timestamp: { seconds: Math.floor(Date.now() / 1000) }
        });
        renderUI();
        renderTransactions();
      }
    }

    async function updateProductDetailsInDb(productId, name, price, count) {
      if (isCloudSyncAvailable && db) {
        try {
          const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'products', productId);
          await setDoc(docRef, {
            name: name,
            price: Number(price),
            count: Number(count),
            updatedAt: serverTimestamp()
          }, { merge: true });
          showToast("更新商品成功", "success");
        } catch (err) {
          console.error("Error saving edit:", err);
        }
      } else {
        const prod = products.find(p => p.id === productId);
        if (prod) {
          prod.name = name;
          prod.price = Number(price);
          prod.count = Number(count);
        }
        renderUI();
        showToast("更新商品成功", "success");
      }
    }

    async function deleteProductInDb(productId) {
      const prod = products.find(p => p.id === productId);
      if (!prod) return;

      if (isCloudSyncAvailable && db) {
        try {
          const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'products', productId);
          await deleteDoc(docRef);
          showToast(`已刪除 ${prod.name}`, "info");
        } catch (err) {
          console.error("Error deleting product:", err);
        }
      } else {
        products = products.filter(p => p.id !== productId);
        renderUI();
        showToast(`已刪除 ${prod.name}`, "info");
      }
    }

    async function resetAllDataInDb() {
      if (isCloudSyncAvailable && db) {
        try {
          for (const prod of products) {
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'products', prod.id);
            await setDoc(docRef, { count: 0 }, { merge: true });
          }
          showToast("已清空本日所有銷售計數", "info");
        } catch (e) {
          console.error("Failed resetting data:", e);
        }
      } else {
        products.forEach(p => p.count = 0);
        transactions = [];
        renderUI();
        renderTransactions();
        showToast("已清空當前數據", "info");
      }
    }

    // UI Rendering Functions
    function renderUI() {
      const grid = document.getElementById('product-list');
      const summaryTable = document.getElementById('summary-table-body');
      
      let grandTotal = 0;
      let grandCount = 0;

      if (products.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full py-12 text-center text-stone-400 bg-white rounded-2xl border border-dashed border-stone-200">
            <i class="fa-solid fa-basket-shopping text-3xl mb-2 text-stone-300"></i>
            <p>目前無銷售商品，請使用上方表單新增品項。</p>
          </div>
        `;
        summaryTable.innerHTML = `<tr><td colspan="4" class="px-5 py-4 text-center text-stone-400 text-xs">無數據</td></tr>`;
      } else {
        let gridHtml = '';
        let tableHtml = '';

        products.forEach(prod => {
          const subtotal = (prod.count || 0) * (prod.price || 0);
          grandTotal += subtotal;
          grandCount += (prod.count || 0);

          // Render Grid Card
          gridHtml += `
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-stone-200 hover:shadow-md transition flex flex-col justify-between">
              <div class="flex items-start justify-between">
                <div>
                  <h3 class="font-bold text-lg text-stone-800 leading-tight">${escapeHtml(prod.name)}</h3>
                  <div class="text-xs text-stone-500 mt-1">
                    單價: <span class="font-semibold text-emerald-700 text-sm">NT$ ${prod.price}</span>
                  </div>
                </div>
                <div class="flex items-center gap-1">
                  <button onclick="openEditModal('${prod.id}')" title="編輯品項" class="text-stone-400 hover:text-stone-600 p-1.5 rounded-lg hover:bg-stone-100 text-xs transition">
                    <i class="fa-solid fa-pen"></i>
                  </button>
                  <button onclick="confirmDeleteProduct('${prod.id}', '${escapeHtml(prod.name)}')" title="刪除品項" class="text-rose-400 hover:text-rose-600 p-1.5 rounded-lg hover:bg-rose-50 text-xs transition">
                    <i class="fa-solid fa-trash"></i>
                  </button>
                </div>
              </div>

              <!-- Controls Section -->
              <div class="mt-4 pt-3 border-t border-stone-100 flex items-center justify-between">
                <div>
                  <span class="text-xs text-stone-400 block">銷售小計</span>
                  <span class="text-lg font-bold text-emerald-800">NT$ ${subtotal.toLocaleString()}</span>
                </div>

                <!-- Touch Friendly Quick Buttons -->
                <div class="flex items-center bg-stone-100 p-1 rounded-xl gap-2">
                  <button onclick="changeQty('${prod.id}', -1)" 
                    class="w-11 h-11 bg-white hover:bg-rose-50 text-rose-600 font-bold rounded-lg shadow-sm border border-stone-200 active:scale-95 flex items-center justify-center text-xl transition">
                    <i class="fa-solid fa-minus"></i>
                  </button>
                  
                  <span class="w-10 text-center font-extrabold text-xl text-stone-800">${prod.count || 0}</span>

                  <button onclick="changeQty('${prod.id}', 1)" 
                    class="w-11 h-11 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg shadow-md active:scale-95 flex items-center justify-center text-xl transition">
                    <i class="fa-solid fa-plus"></i>
                  </button>
                </div>
              </div>
            </div>
          `;

          // Render Table Row
          tableHtml += `
            <tr class="hover:bg-stone-50">
              <td class="px-5 py-3 font-medium text-stone-800">${escapeHtml(prod.name)}</td>
              <td class="px-5 py-3">NT$ ${prod.price}</td>
              <td class="px-5 py-3 font-semibold text-stone-700">${prod.count || 0} 包/件</td>
              <td class="px-5 py-3 text-right font-bold text-emerald-700">NT$ ${subtotal.toLocaleString()}</td>
            </tr>
          `;
        });

        grid.innerHTML = gridHtml;
        summaryTable.innerHTML = tableHtml;
      }

      // Update Total Displays
      document.getElementById('grand-total').innerText = `NT$ ${grandTotal.toLocaleString()}`;
      document.getElementById('grand-count').innerText = grandCount;
    }

    function renderTransactions() {
      const container = document.getElementById('transaction-log-list');
      if (!transactions || transactions.length === 0) {
        container.innerHTML = `<div class="p-6 text-center text-stone-400 text-xs">暫無動態點數異動紀錄</div>`;
        return;
      }

      let html = '';
      transactions.slice(0, 50).forEach(tx => {
        const timeStr = tx.timestamp?.seconds 
          ? new Date(tx.timestamp.seconds * 1000).toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', second: '2-digit' })
          : '剛才';
        
        const isPlus = tx.delta > 0;
        const badgeColor = isPlus ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800';

        html += `
          <div class="px-5 py-3 flex items-center justify-between text-xs hover:bg-stone-50 transition">
            <div class="flex items-center space-x-3">
              <span class="px-2 py-0.5 rounded-md font-bold ${badgeColor}">
                ${isPlus ? '+' + tx.delta : tx.delta}
              </span>
              <span class="font-semibold text-stone-700">${escapeHtml(tx.productName)}</span>
            </div>
            <div class="flex items-center gap-4 text-stone-500">
              <span>小計變動: <strong class="text-stone-800">NT$ ${tx.totalChange}</strong></span>
              <span class="text-stone-400">${timeStr}</span>
            </div>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    // Status Indicator Update
    function updateSyncStatus(isOnline, text) {
      const indicator = document.getElementById('sync-status-indicator');
      const textSpan = document.getElementById('sync-status-text');
      const footerStatus = document.getElementById('firebase-status');

      if (isOnline) {
        indicator.className = 'w-2 h-2 rounded-full bg-emerald-400 inline-block animate-pulse';
        textSpan.innerText = text || '雲端同步中';
        footerStatus.innerText = '雲端即時同步模式';
      } else {
        indicator.className = 'w-2 h-2 rounded-full bg-amber-400 inline-block';
        textSpan.innerText = text || '本機離線模式';
        footerStatus.innerText = '單機離線紀錄模式';
      }
    }

    // Global Action Handlers attached to Window
    window.handleCreateProduct = function(event) {
      event.preventDefault();
      const nameInput = document.getElementById('new-product-name');
      const priceInput = document.getElementById('new-product-price');

      const name = nameInput.value.trim();
      const price = parseFloat(priceInput.value);

      if (!name || isNaN(price)) return;

      createProductInDb(name, price, 0);

      nameInput.value = '';
      priceInput.value = '';
    };

    window.changeQty = function(productId, delta) {
      updateProductQuantityInDb(productId, delta);
    };

    window.openEditModal = function(productId) {
      const prod = products.find(p => p.id === productId);
      if (!prod) return;

      document.getElementById('edit-product-id').value = prod.id;
      document.getElementById('edit-product-name').value = prod.name;
      document.getElementById('edit-product-price').value = prod.price;
      document.getElementById('edit-product-count').value = prod.count || 0;

      document.getElementById('edit-modal').classList.remove('hidden');
    };

    window.closeEditModal = function() {
      document.getElementById('edit-modal').classList.add('hidden');
    };

    window.handleSaveEdit = function(event) {
      event.preventDefault();
      const id = document.getElementById('edit-product-id').value;
      const name = document.getElementById('edit-product-name').value.trim();
      const price = document.getElementById('edit-product-price').value;
      const count = document.getElementById('edit-product-count').value;

      if (!id || !name) return;

      updateProductDetailsInDb(id, name, price, count);
      closeEditModal();
    };

    window.confirmDeleteProduct = function(productId, productName) {
      showCustomConfirm(`確定要刪除商品「${productName}」嗎？`, () => {
        deleteProductInDb(productId);
      });
    };

    window.confirmResetSession = function() {
      showCustomConfirm("確定要重置並清空所有商品的銷售數量嗎？此動作將會歸零今日數據。", () => {
        resetAllDataInDb();
      });
    };

    window.exportCSV = function() {
      if (products.length === 0) {
        showToast("無可供匯出的數據", "info");
        return;
      }

      let csvContent = "\uFEFF"; // UTF-8 BOM for Excel Chinese characters
      csvContent += "商品名稱,單價(NT$),銷售數量,銷售小計\n";

      let totalAmount = 0;
      let totalQty = 0;

      products.forEach(p => {
        const subtotal = (p.count || 0) * (p.price || 0);
        totalAmount += subtotal;
        totalQty += (p.count || 0);
        csvContent += `"${p.name.replace(/"/g, '""')}",${p.price},${p.count || 0},${subtotal}\n`;
      });

      csvContent += `\n"總計",,${totalQty},${totalAmount}\n`;

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      const dateStr = new Date().toISOString().slice(0, 10);
      link.setAttribute("href", url);
      link.setAttribute("download", `市集銷售紀錄_${dateStr}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      showToast("CSV 報表已開始下載", "success");
    };

    window.switchTab = function(tabName) {
      const salesTab = document.getElementById('tab-sales');
      const historyTab = document.getElementById('tab-history');
      const salesBtn = document.getElementById('tab-btn-sales');
      const historyBtn = document.getElementById('tab-btn-history');

      if (tabName === 'sales') {
        salesTab.classList.remove('hidden');
        historyTab.classList.add('hidden');

        salesBtn.className = "px-3 py-1.5 rounded-lg transition-all duration-200 bg-white text-emerald-900 shadow";
        historyBtn.className = "px-3 py-1.5 rounded-lg transition-all duration-200 text-emerald-100 hover:text-white";
      } else {
        salesTab.classList.add('hidden');
        historyTab.classList.remove('hidden');

        historyBtn.className = "px-3 py-1.5 rounded-lg transition-all duration-200 bg-white text-emerald-900 shadow";
        salesBtn.className = "px-3 py-1.5 rounded-lg transition-all duration-200 text-emerald-100 hover:text-white";
      }
    };

    // Helper functions
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, function(m) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        }[m];
      });
    }

    function showToast(message, type = "info") {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      
      let bgColor = "bg-stone-800 text-white";
      if (type === "success") bgColor = "bg-emerald-700 text-white";
      if (type === "error") bgColor = "bg-rose-700 text-white";

      toast.className = `${bgColor} text-xs font-medium px-4 py-3 rounded-xl shadow-lg flex items-center justify-between gap-3 transform transition-all duration-300 translate-y-2 opacity-0`;
      toast.innerHTML = `
        <span>${message}</span>
        <button onclick="this.parentElement.remove()" class="text-white/80 hover:text-white">
          <i class="fa-solid fa-xmark"></i>
        </button>
      `;

      container.appendChild(toast);
      
      setTimeout(() => {
        toast.classList.remove('translate-y-2', 'opacity-0');
      }, 10);

      setTimeout(() => {
        toast.classList.add('opacity-0');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    function showCustomConfirm(message, onConfirm) {
      const modal = document.createElement('div');
      modal.className = "fixed inset-0 bg-stone-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4";
      modal.innerHTML = `
        <div class="bg-white rounded-2xl max-w-xs w-full p-5 shadow-xl border border-stone-100 text-center space-y-4">
          <div class="w-12 h-12 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto text-xl">
            <i class="fa-solid fa-triangle-exclamation"></i>
          </div>
          <p class="text-sm font-medium text-stone-800">${message}</p>
          <div class="flex items-center justify-center gap-2 pt-2">
            <button id="cancel-btn" class="px-4 py-2 bg-stone-100 text-stone-600 text-xs font-medium rounded-xl hover:bg-stone-200">取消</button>
            <button id="confirm-btn" class="px-4 py-2 bg-rose-600 text-white text-xs font-semibold rounded-xl hover:bg-rose-700 shadow">確定執行</button>
          </div>
        </div>
      `;
      document.body.appendChild(modal);

      modal.querySelector('#cancel-btn').onclick = () => modal.remove();
      modal.querySelector('#confirm-btn').onclick = () => {
        onConfirm();
        modal.remove();
      };
    }
  </script>
</body>
</html>
